[project]
name = "python-orm-sample"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "email-validator>=2.1",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.26,<1",
  "jinja2>=3.1",
  "jsonschema>=4.22",
  "ruff>=0.6",
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# ruff 0.17+ は Markdown 内のコードブロックも整形対象にするため docs を除外
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.text".msg = "生SQL禁止: ORM モデル経由でアクセスすること"
"sqlalchemy.sql.text".msg = "生SQL禁止: ORM モデル経由でアクセスすること"
"sqlalchemy.sql.expression.text".msg = "生SQL禁止: ORM モデル経由でアクセスすること"
"psycopg".msg = "DB ドライバの直接利用禁止: ORM モデル経由でアクセスすること"

[tool.ruff.lint.per-file-ignores]
"app/generated/**" = ["E501", "F401", "I"]
"migrations/**" = ["E501", "F401", "I", "TID251"]
